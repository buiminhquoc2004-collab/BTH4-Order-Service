spring.application.name=order-management
server.port=8082
spring.datasource.url=${ORDER_DB_URL:jdbc:mysql://localhost:3306/BTH4_ORDER?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=UTF-8}
spring.datasource.username=${ORDER_DB_USER:root}
spring.datasource.password=${ORDER_DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
auth.service.base-url=${AUTH_SERVICE_URL:http://localhost:8080}
app.product.url=${PRODUCT_SERVICE_URL:http://localhost:8081}
